name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.repo.outputs.repo }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image repo path
        id: repo
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ steps.repo.outputs.repo }}/backend:latest
            ${{ steps.repo.outputs.repo }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          build-args: |
            REACT_APP_BACKEND_URL=
          tags: |
            ${{ steps.repo.outputs.repo }}/frontend:latest
            ${{ steps.repo.outputs.repo }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Pull & restart on VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_REPO: ${{ needs.build.outputs.image_repo }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          timeout:         60s
          command_timeout: 20m
          envs: IMAGE_REPO,GH_USER,GH_TOKEN
          script: |
            set -e

            echo "==> [1/5] Pulling latest compose / config files..."
            cd /opt/jvsapp
            git pull origin main

            echo "==> [2/5] Logging in to GHCR..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

            echo "==> [3/5] Pulling pre-built images ($IMAGE_REPO)..."
            export IMAGE_REPO
            docker compose -f docker-compose.prod.yml pull

            echo "==> [4/5] Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> [5/5] Cleaning up old images..."
            docker image prune -f
            docker logout ghcr.io || true

            echo ""
            echo "--- Container status ---"
            docker compose -f docker-compose.prod.yml ps
            echo ""
            echo "--- Disk usage ---"
            df -h /
            docker system df

name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.SSH_PRIVATE_KEY }}
          port:     22
          timeout:         60s
          command_timeout: 60m
          script: |
            set -e

            echo "==> [1/4] Pulling latest code..."
            cd /opt/jvsapp
            git pull origin main

            echo "==> [2/4] Building & starting containers..."
            DOCKER_BUILDKIT=1 docker compose -f docker-compose.prod.yml up --build -d

            echo "==> [3/4] Cleaning up Docker artifacts..."

            # Remove stopped containers
            docker container prune -f

            # Remove dangling images (old build layers no longer referenced)
            docker image prune -f

            # Remove unused images older than 24 h (keeps the currently running ones)
            docker image prune -a -f --filter "until=24h"

            # Remove unused build cache older than 24 h
            docker builder prune -f --filter "until=24h"

            # Remove unused networks (never touches named volumes like mongo_data)
            docker network prune -f

            echo "==> [4/4] Deployment complete!"
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "--- Disk usage after cleanup ---"
            df -h /
            docker system df

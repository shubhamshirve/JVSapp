version: '3.8'

services:

  mongodb:
    image: mongo:7
    container_name: jvs_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jvs_db
    networks:
      - jvs_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jvs_backend
    restart: unless-stopped
    environment:
      MONGO_URL:       mongodb://mongodb:27017
      DB_NAME:         jvs_db
      ADMIN_EMAIL:     ${ADMIN_EMAIL:-admin@jivdani.com}
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD:-Jivdani@2026}
      JWT_SECRET:      ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS:    "http://${VPS_IP:-45.196.196.114}"
    depends_on:
      - mongodb
    networks:
      - jvs_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: jvs_frontend
    restart: unless-stopped
    environment:
      # ":80" for IP-only access. Change to "yourdomain.com" for auto-HTTPS.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy stores Let's Encrypt certs here (needed if using a domain)
      - caddy_data:/data
    depends_on:
      - backend
    networks:
      - jvs_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
  caddy_data:

networks:
  jvs_net:
    driver: bridge

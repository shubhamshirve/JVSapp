# docker-compose.prod.yml — Pre-built image deploy (used by GitHub Actions)
# See docker-compose.yml for local/simple builds

services:
  mongo:
    image: mongo:7
    container_name: jvs_mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - jvs_net

  backend:
    image: ${IMAGE_REPO:-jvsapp-local}/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jvs_backend
    restart: unless-stopped
    environment:
      MONGO_URL:       mongodb://mongo:27017
      DB_NAME:         "${DB_NAME:-jivdani}"
      ADMIN_EMAIL:     "${ADMIN_EMAIL:-admin@jivdani.com}"
      ADMIN_PASSWORD:  "${ADMIN_PASSWORD}"
      ADMIN_PASSWORD_RESET: "${ADMIN_PASSWORD_RESET:-}"
      JWT_SECRET:      "${JWT_SECRET}"
      CORS_ORIGINS:    "${SITE_URL:-https://app.mmpf.in}"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - jvs_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: ${IMAGE_REPO:-jvsapp-local}/frontend:latest
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: jvs_caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-app.mmpf.in}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - jvs_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  jvs_net:
    driver: bridge
